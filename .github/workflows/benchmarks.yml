name: Performance Benchmarks

permissions:
  contents: read

on:
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      suite:
        description: Benchmark suite to run
        required: true
        default: full
        type: choice
        options:
          - quick
          - micro
          - scenarios
          - full

concurrency:
  group: performance-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  benchmark:
    name: Benchmark suite
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        run: |
          rustup toolchain install
          rustc --version

      - name: Resolve benchmark suite
        id: suite
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "pull_request") {
            $suite = "quick"
          }
          elseif ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $suite = "${{ inputs.suite }}"
          }
          else {
            $suite = "full"
          }

          "value=$suite" >> $env:GITHUB_OUTPUT

      - name: Run benchmark suite
        shell: pwsh
        run: ./scripts/bench.ps1 -Suite "${{ steps.suite.outputs.value }}"

      - name: Emit performance warnings
        if: ${{ success() && steps.suite.outputs.value != 'micro' }}
        shell: pwsh
        run: ./scripts/emit-benchmark-warnings.ps1 -ComparisonPath target/nexus-bench/benchmark-comparison.json

      - name: Inspect scenario output
        if: ${{ always() }}
        id: results
        shell: pwsh
        run: |
          $rawPresent = Get-ChildItem "target/nexus-bench" -Filter "*.json" -ErrorAction SilentlyContinue |
            Where-Object Name -notin @("benchmark-results.json", "benchmark-comparison.json") |
            Select-Object -First 1
          $aggregatePresent = Test-Path "target/nexus-bench/benchmark-results.json"
          $comparisonPresent = Test-Path "target/nexus-bench/benchmark-comparison.json"
          "raw_present=$($null -ne $rawPresent)".ToLowerInvariant() >> $env:GITHUB_OUTPUT
          "aggregate_present=$aggregatePresent".ToLowerInvariant() >> $env:GITHUB_OUTPUT
          "comparison_present=$comparisonPresent".ToLowerInvariant() >> $env:GITHUB_OUTPUT

      - name: Upload raw scenario results
        if: ${{ always() && steps.results.outputs.raw_present == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nexus-benchmark-raw-results-${{ steps.suite.outputs.value }}
          path: |
            target/nexus-bench/*.json
            !target/nexus-bench/benchmark-results.json
            !target/nexus-bench/benchmark-comparison.json
            target/nexus-bench/retry/**
          if-no-files-found: warn
          retention-days: 7

      - name: Upload aggregate benchmark results
        if: ${{ always() && steps.results.outputs.aggregate_present == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nexus-benchmark-results-${{ steps.suite.outputs.value }}
          path: target/nexus-bench/benchmark-results.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload benchmark comparison
        if: ${{ always() && steps.results.outputs.comparison_present == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nexus-benchmark-comparison-${{ steps.suite.outputs.value }}
          path: target/nexus-bench/benchmark-comparison.json
          if-no-files-found: error
          retention-days: 7

      - name: Write benchmark summary
        if: ${{ always() }}
        shell: pwsh
        run: |
          $rawArtifact = if ("${{ steps.results.outputs.raw_present }}" -eq "true") {
            "uploaded"
          }
          else {
            "not applicable"
          }
          $aggregateArtifact = if ("${{ steps.results.outputs.aggregate_present }}" -eq "true") {
            "uploaded"
          }
          else {
            "not applicable"
          }
          if ("${{ steps.results.outputs.comparison_present }}" -eq "true") {
            $comparison = Get-Content "target/nexus-bench/benchmark-comparison.json" -Raw | ConvertFrom-Json
            . ./scripts/benchmark-regression-report.ps1
            $observations = @(Get-BenchmarkPerformanceObservations -ComparisonPath "target/nexus-bench/benchmark-comparison.json")
            $informationalSummary = Get-InformationalBenchmarkMarkdown -Slowdowns $observations
            $comparisonSummary = @"
          - Baseline: benchmarks/baselines/github-ubuntu-x64/benchmark-results.json (schema 1)
          - Compared scenarios: $($comparison.summary.compared_scenarios)
          - Largest positive timing delta: $($comparison.summary.largest_positive_delta_percent)%
          - Largest negative timing delta: $($comparison.summary.largest_negative_delta_percent)%
          "@
          }
          else {
            $comparisonSummary = "- Benchmark comparison: not applicable"
            $informationalSummary = @"
          ### Informational slowdowns (>10% total mean)

          None.

          Informational only — this does not affect job status.
          "@
          }

          @"
          ## Performance Benchmarks

          - Performance suite: ${{ steps.suite.outputs.value }}
          - Commit: ${{ github.sha }}
          - Raw scenario JSON: $rawArtifact
          - Aggregate benchmark-results.json: $aggregateArtifact
          $comparisonSummary

          $informationalSummary
          "@ >> $env:GITHUB_STEP_SUMMARY

      - name: Run performance gate
        if: ${{ success() && steps.suite.outputs.value != 'micro' && steps.results.outputs.comparison_present == 'true' }}
        shell: pwsh
        run: ./scripts/run-benchmark-gate.ps1 -ComparisonPath target/nexus-bench/benchmark-comparison.json -RetryOutputDir target/nexus-bench/retry
