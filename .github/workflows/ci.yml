name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    name: Rust Engine
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup toolchain install
          rustc --version

      - name: Install wasm-pack
        run: |
          curl https://wasm-bindgen.github.io/wasm-pack/installer/init.sh -sSf | sh -s -- --version 0.13.1
          wasm-pack --version

      - name: Validate engine and build WASM
        shell: pwsh
        run: ./scripts/check.ps1 -Target engine

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexus-wasm
          path: web/src/wasm
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  web:
    name: TypeScript Web
    runs-on: ubuntu-latest
    needs: engine

    steps:
      - uses: actions/checkout@v4

      - name: Download WASM artifact
        uses: actions/download-artifact@v8
        with:
          name: nexus-wasm
          path: web/src/wasm

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Validate web
        shell: pwsh
        run: ./scripts/check.ps1 -Target web
