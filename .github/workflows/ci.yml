name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

jobs:
  engine:
    name: Rust Engine
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        run: |
          rustup toolchain install
          rustc --version

      - name: Install wasm-pack
        run: |
          curl https://wasm-bindgen.github.io/wasm-pack/installer/init.sh -sSf | sh -s -- --version 0.13.1
          wasm-pack --version

      - name: Validate engine and build WASM
        shell: pwsh
        run: ./scripts/check.ps1 -Target engine

      - name: Upload WASM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nexus-wasm
          path: web/src/wasm
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  web:
    name: TypeScript Web
    runs-on: ubuntu-latest
    needs: engine

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download WASM artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nexus-wasm
          path: web/src/wasm

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Validate web
        shell: pwsh
        run: ./scripts/check.ps1 -Target web
