[package]
name = "nexus-engine"
version = "0.1.0"
edition = "2021"
description = "Deterministic engine for the Nexus emergent-society simulation"
repository = "https://github.com/AdriGB/Nexus"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
benchmarks = []

[[bin]]
name = "nexus-bench"
path = "src/bin/nexus-bench.rs"
required-features = ["benchmarks"]

[[bench]]
name = "pathfinding"
harness = false
required-features = ["benchmarks"]

[[bench]]
name = "spatial"
harness = false
required-features = ["benchmarks"]

[[bench]]
name = "autonomy"
harness = false
required-features = ["benchmarks"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
noise = "0.9"
console_error_panic_hook = "0.1"
getrandom = { version = "0.2", features = ["js"] }
web-time = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
bytemuck = { version = "1", features = ["derive"] }
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Document", "HtmlCanvasElement", "Window"] }
wgpu = { version = "30", default-features = false, features = ["std", "webgpu", "wgsl"] }

[dev-dependencies]
criterion = "0.8.2"
naga = { version = "30", features = ["wgsl-in"] }
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = 3
lto = true
